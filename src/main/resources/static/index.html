<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen KTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container mt-5">

<h2 class="mb-4">Manajemen Data KTP</h2>

<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title" id="formTitle">Tambah Data KTP</h5>

        <form id="ktpForm">
            <input type="hidden" id="id">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Nomor KTP</label>
                    <input type="text" id="nomorKtp" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="namaLengkap" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tanggal Lahir</label>
                    <input type="date" id="tanggalLahir" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Alamat</label>
                    <input type="text" id="alamat" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Jenis Kelamin</label>
                    <select id="jenisKelamin" class="form-control">
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="col-md-12 d-flex justify-content-end mt-3">
                    <button type="submit" id="btnSubmit" class="btn btn-primary">Simpan</button>
                    <button type="button" id="btnCancel" class="btn btn-secondary ms-2" style="display:none;" onclick="resetForm()">Batal</button>
                </div>
            </div>
        </form>
    </div>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>No. KTP</th>
        <th>Nama</th>
        <th>Alamat</th>
        <th>Tgl Lahir</th>
        <th>Jenis Kelamin</th>
        <th>Aksi</th>
    </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    const apiUrl = "http://localhost:8080/api/ktp";
    let isUpdate = false;

    $(document).ready(function () {
        loadData();

        $("#ktpForm").submit(function (e) {
            e.preventDefault();

            const data = {
                nomorKtp: $("#nomorKtp").val(),
                namaLengkap: $("#namaLengkap").val(),
                alamat: $("#alamat").val(),
                tanggalLahir: $("#tanggalLahir").val(),
                jenisKelamin: $("#jenisKelamin").val()
            };

            if (isUpdate) {
                updateData($("#id").val(), data);
            } else {
                addData(data);
            }
        });
    });

    function loadData() {
        $.get(apiUrl, function (response) {
            let rows = "";
            response.forEach(item => {
                rows += `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.nomorKtp}</td>
                    <td>${item.namaLengkap}</td>
                    <td>${item.alamat}</td>
                    <td>${item.tanggalLahir}</td>
                    <td>${item.jenisKelamin}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editData(${item.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteData(${item.id})">Hapus</button>
                    </td>
                </tr>`;
            });
            $("#tableBody").html(rows);
        });
    }

    function addData(data) {
        $.ajax({
            url: apiUrl,
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(data),
            success: function () {
                alert("Data berhasil ditambahkan!");
                resetForm();
                loadData();
            },
            error: function (err) {
                alert("Gagal menambah data: " + err.responseText);
            }
        });
    }

    function editData(id) {
        $.get(apiUrl + "/" + id, function (data) {
            $("#id").val(data.id);
            $("#nomorKtp").val(data.nomorKtp);
            $("#namaLengkap").val(data.namaLengkap);
            $("#alamat").val(data.alamat);
            $("#tanggalLahir").val(data.tanggalLahir);
            $("#jenisKelamin").val(data.jenisKelamin);

            $("#formTitle").text("Edit Data KTP");
            $("#btnSubmit").text("Update").removeClass("btn-primary").addClass("btn-success");
            $("#btnCancel").show();

            isUpdate = true;
        });
    }

    function updateData(id, data) {
        $.ajax({
            url: apiUrl + "/" + id,
            type: "PUT",
            contentType: "application/json",
            data: JSON.stringify(data),
            success: function () {
                alert("Data berhasil diperbarui!");
                resetForm();
                loadData();
            },
            error: function (err) {
                alert("Gagal update: " + err.responseText);
            }
        });
    }

    function deleteData(id) {
        if (confirm("Yakin menghapus data ini?")) {
            $.ajax({
                url: apiUrl + "/" + id,
                type: "DELETE",
                success: function () {
                    alert("Data berhasil dihapus");
                    loadData();
                }
            });
        }
    }

    function resetForm() {
        $("#id").val("");
        $("#nomorKtp").val("");
        $("#namaLengkap").val("");
        $("#alamat").val("");
        $("#tanggalLahir").val("");
        $("#jenisKelamin").val("Laki-laki");

        $("#formTitle").text("Tambah Data KTP");
        $("#btnSubmit").text("Simpan").removeClass("btn-success").addClass("btn-primary");
        $("#btnCancel").hide();

        isUpdate = false;
    }
</script>

</body>
</html>
