<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Data KTP - Tugas CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid #007bff; margin-bottom: 20px; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Pendaftaran Data KTP</h2>
    </div>

    <form id="ktpForm" class="row g-3 mb-5">
        <input type="hidden" id="ktpId"> <div class="col-md-6">
        <label class="form-label">Nomor KTP</label>
        <input type="text" class="form-control" id="nomorKtp" required>
    </div>
        <div class="col-md-6">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="namaLengkap" required>
        </div>
        <div class="col-12">
            <label class="form-label">Alamat</label>
            <textarea class="form-control" id="alamat" rows="2" required></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label">Tanggal Lahir</label>
            <input type="date" class="form-control" id="tanggalLahir" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Jenis Kelamin</label>
            <select class="form-select" id="jenisKelamin" required>
                <option value="">Pilih...</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
        </div>
        <div class="col-12 mt-4">
            <button type="submit" id="btnSave" class="btn btn-primary">Simpan Data</button>
            <button type="button" id="btnCancel" class="btn btn-secondary" style="display:none;">Batal Edit</button>
        </div>
    </form>

    <hr>

    <h4>Daftar KTP Terdaftar</h4>
    <div class="table-responsive">
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
            <tr>
                <th>Nomor KTP</th>
                <th>Nama Lengkap</th>
                <th>Alamat</th>
                <th>Tanggal Lahir</th>
                <th>Jenis Kelamin</th>
                <th>Aksi</th>
            </tr>
            </thead>
            <tbody id="ktpTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080/ktp";

    $(document).ready(function() {
        loadKtpData();

        // Handle Form Submit (Tambah & Update)
        $("#ktpForm").submit(function(e) {
            e.preventDefault();

            const id = $("#ktpId").val();
            const ktpData = {
                nomorKtp: $("#nomorKtp").val(),
                namaLengkap: $("#namaLengkap").val(),
                alamat: $("#alamat").val(),
                tanggalLahir: $("#tanggalLahir").val(),
                jenisKelamin: $("#jenisKelamin").val()
            };

            const type = id ? "PUT" : "POST";
            const url = id ? `${API_URL}/${id}` : API_URL;

            $.ajax({
                url: url,
                type: type,
                contentType: "application/json",
                data: JSON.stringify(ktpData),
                success: function(response) {
                    alert(id ? "Data berhasil diperbarui!" : "Data berhasil ditambahkan!");
                    resetForm();
                    loadKtpData();
                },
                error: function(err) {
                    alert("Error: " + (err.responseJSON ? err.responseJSON.message : "Terjadi kesalahan"));
                }
            });
        });

        // Tombol Batal Edit
        $("#btnCancel").click(function() {
            resetForm();
        });
    });

    // Fungsi Ambil Data (GET)
    function loadKtpData() {
        $.get(API_URL, function(data) {
            let rows = "";
            data.forEach(ktp => {
                rows += `
                <tr>
                    <td>${ktp.nomorKtp}</td>
                    <td>${ktp.namaLengkap}</td>
                    <td>${ktp.alamat}</td>
                    <td>${ktp.tanggalLahir}</td>
                    <td>${ktp.jenisKelamin}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editKtp(${ktp.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteKtp(${ktp.id})">Hapus</button>
                    </td>
                </tr>`;
            });
            $("#ktpTableBody").html(rows);
        });
    }

    // Ambil Satu Data untuk Edit (GET by ID)
    function editKtp(id) {
        $.get(`${API_URL}/${id}`, function(ktp) {
            $("#ktpId").val(ktp.id);
            $("#nomorKtp").val(ktp.nomorKtp).prop('disabled', true); // Nomor KTP biasanya tidak boleh diedit
            $("#namaLengkap").val(ktp.namaLengkap);
            $("#alamat").val(ktp.alamat);
            $("#tanggalLahir").val(ktp.tanggalLahir);
            $("#jenisKelamin").val(ktp.jenisKelamin);

            $("#btnSave").text("Update Data").removeClass("btn-primary").addClass("btn-success");
            $("#btnCancel").show();
        });
    }

    // Hapus Data (DELETE)
    function deleteKtp(id) {
        if(confirm("Apakah Anda yakin ingin menghapus data ini?")) {
            $.ajax({
                url: `${API_URL}/${id}`,
                type: "DELETE",
                success: function() {
                    alert("Data berhasil dihapus!");
                    loadKtpData();
                }
            });
        }
    }

    function resetForm() {
        $("#ktpForm")[0].reset();
        $("#ktpId").val("");
        $("#nomorKtp").prop('disabled', false);
        $("#btnSave").text("Simpan Data").removeClass("btn-success").addClass("btn-primary");
        $("#btnCancel").hide();
    }
</script>

</body>
</html>
